<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - URL Shortener</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar">

    <h1>URL Shortener</h1>

    <form
            th:action="@{/logout}"
            method="post">

        <button
                type="submit"
                class="logout-button">
            Logout
        </button>

    </form>

</nav>


<main class="container">

    <!-- Create URL -->

    <div class="card">

        <h2>Create Short URL</h2>

        <form
                th:action="@{/dashboard}"
                th:object="${createUrlRequest}"
                method="post">

            <p
                    class="error"
                    th:if="${#fields.hasGlobalErrors()}"
                    th:each="error : ${#fields.globalErrors()}"
                    th:text="${error}">
            </p>
            
            <div class="form-group">

                <label>Original URL</label>

                <input
                        type="url"
                        th:field="*{originalUrl}"
                        placeholder="https://example.com"
                        required>

                <p
                        class="error"
                        th:if="${#fields.hasErrors('originalUrl')}"
                        th:errors="*{originalUrl}">
                </p>

            </div>


            <div class="form-group">

                <label>Expiration</label>

                <input
                        type="datetime-local"
                        th:field="*{expiresAt}">

                <p
                        class="error"
                        th:if="${#fields.hasErrors('expiresAt')}"
                        th:errors="*{expiresAt}">
                </p>

            </div>


            <button
                    type="submit"
                    class="primary-button">
                Shorten URL
            </button>

        </form>

    </div>


    <!-- URL List -->

    <div class="card">

        <h2>Your URLs</h2>

        <div th:if="${#lists.isEmpty(urls)}">

            <p>You haven't shortened any URLs yet.</p>

        </div>


        <div
                class="table-container"
                th:if="${!#lists.isEmpty(urls)}">

            <table class="url-table">

                <thead>

                <tr>
                    <th>Original URL</th>
                    <th>Short URL</th>
                    <th>Clicks</th>
                    <th>Created</th>
                    <th>Expires</th>
                    <th>Action</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="url : ${urls}">

                    <!-- Original URL -->

                    <td th:text="${url.originalUrl}">
                        Original URL
                    </td>


                    <!-- Short URL -->

                    <td>

                        <a
                                th:href="${url.shortUrl}"
                                th:text="${url.shortUrl}"
                                target="_blank">
                            Short URL
                        </a>

                        <button
                                type="button"
                                class="copy-button"
                                th:attr="data-url=${url.shortUrl}"
                                onclick="copyUrl(this)">
                            Copy
                        </button>

                    </td>


                    <!-- Clicks -->

                    <td th:text="${url.clickCount}">
                        0
                    </td>


                    <!-- Created -->

                    <td
                            th:text="${#temporals.format(url.createdAt, 'dd MMM yyyy, HH:mm')}">
                        Created
                    </td>


                    <!-- Expiration -->

                    <td>

                        <span
                                th:if="${url.expiresAt != null}"
                                th:text="${#temporals.format(url.expiresAt, 'dd MMM yyyy, HH:mm')}">
                            Expiration
                        </span>

                        <span th:if="${url.expiresAt == null}">
                            Never
                        </span>

                    </td>


                    <!-- Delete -->

                    <td>

                        <form
                                th:action="@{'/dashboard/' + ${url.shortCode} + '/delete'}"
                                method="post">

                            <button
                                    type="submit"
                                    class="delete-button">
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<script>

    function copyUrl(button) {

        const url = button.getAttribute("data-url");

        navigator.clipboard.writeText(url)
            .then(() => {

                button.textContent = "Copied!";

                setTimeout(() => {
                    button.textContent = "Copy";
                }, 1500);

            })
            .catch(() => {
                alert("Failed to copy URL");
            });
    }

</script>

</body>

</html>
