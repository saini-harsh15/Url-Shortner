<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register - URL Shortener</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>Create Account</h1>


        <form
                th:action="@{/register}"
                th:object="${registerRequest}"
                method="post">


            <div class="form-group">

                <label>Email</label>

                <input
                        type="email"
                        th:field="*{email}"
                        placeholder="Enter your email"
                        required>

                <p
                        class="error"
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}">
                </p>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                        type="password"
                        th:field="*{password}"
                        placeholder="Create a password"
                        required>

                <p
                        class="error"
                        th:if="${#fields.hasErrors('password')}"
                        th:errors="*{password}">
                </p>

            </div>


            <p
                    class="error"
                    th:if="${#fields.hasGlobalErrors()}"
                    th:each="error : ${#fields.globalErrors()}"
                    th:text="${error}">
            </p>


            <button
                    type="submit"
                    class="primary-button">
                Create Account
            </button>

        </form>


        <div class="auth-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
