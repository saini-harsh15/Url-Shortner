<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - URL Shortener</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>URL Shortener</h1>

        <p
                class="success-message"
                th:if="${param.registered}">
            Registration successful. Please login.
        </p>

        <p
                class="error-message"
                th:if="${param.error}">
            Invalid email or password.
        </p>

        <p
                class="success-message"
                th:if="${param.logout}">
            You have been logged out.
        </p>


        <form
                th:action="@{/login}"
                method="post">

            <div class="form-group">

                <label>Email</label>

                <input
                        type="email"
                        name="username"
                        placeholder="Enter your email"
                        required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

            </div>


            <button
                    type="submit"
                    class="primary-button">
                Login
            </button>

        </form>


        <div class="auth-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>

    </div>

</div>

</body>

</html>
